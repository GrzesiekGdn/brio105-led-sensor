<svg xmlns="http://www.w3.org/2000/svg" width="660" height="600" color="#1A1F24" viewBox="0 0 660 600" role="img" aria-label="Layout B: the resistor is soldered straight into the board, one leg in D0 and one in GND. The two-wire cable runs red from 3V3 to the phototransistor's C leg and black from D0 to its E leg, so the D0 hole holds both the resistor leg and the black cable wire."><style>text{font-family:"Atkinson Hyperlegible",Helvetica,Arial,"Liberation Sans",sans-serif}.m{font-family:"JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,monospace}</style><rect width="660" height="600" rx="14" fill="#FFFFFF"/>
      <defs>
        <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>
      </defs>
      <!-- USB + board -->
      <text x="320" y="14" font-size="12.5" text-anchor="middle" fill="#56606A">USB-C → computer</text>
      <rect x="285" y="22" width="70" height="28" rx="8" fill="#A7B0B8"/>
      <rect x="210" y="40" width="220" height="260" rx="14" fill="#E1E6EA" stroke="currentColor" stroke-width="1.5"/>
      <text x="320" y="200" font-size="15" font-weight="700" text-anchor="middle" fill="#56606A">XIAO</text>
      <text x="320" y="218" font-size="13" text-anchor="middle" fill="#56606A">ESP32-C6</text>

      <!-- pads: left D0..D6, right 5V GND 3V3 D10 D9 D8 D7 -->
      <g fill="#C39A3E">
        <circle cx="226" cy="75.5" r="8"/><circle cx="226" cy="107" r="8"/><circle cx="226" cy="138.5" r="8"/><circle cx="226" cy="170" r="8"/><circle cx="226" cy="201.5" r="8"/><circle cx="226" cy="233" r="8"/><circle cx="226" cy="264.5" r="8"/>
        <circle cx="414" cy="75.5" r="8"/><circle cx="414" cy="107" r="8"/><circle cx="414" cy="138.5" r="8"/><circle cx="414" cy="170" r="8"/><circle cx="414" cy="201.5" r="8"/><circle cx="414" cy="233" r="8"/><circle cx="414" cy="264.5" r="8"/>
      </g>
      <g fill="#E1E6EA">
        <circle cx="226" cy="75.5" r="3.5"/><circle cx="226" cy="107" r="3.5"/><circle cx="226" cy="138.5" r="3.5"/><circle cx="226" cy="170" r="3.5"/><circle cx="226" cy="201.5" r="3.5"/><circle cx="226" cy="233" r="3.5"/><circle cx="226" cy="264.5" r="3.5"/>
        <circle cx="414" cy="75.5" r="3.5"/><circle cx="414" cy="107" r="3.5"/><circle cx="414" cy="138.5" r="3.5"/><circle cx="414" cy="170" r="3.5"/><circle cx="414" cy="201.5" r="3.5"/><circle cx="414" cy="233" r="3.5"/><circle cx="414" cy="264.5" r="3.5"/>
      </g>
      <g font-size="13" class="m" fill="#56606A">
        <text x="242" y="80" font-weight="700" fill="#855C00">D0 / A0</text>
        <text x="242" y="111.5">D1</text><text x="242" y="143">D2</text><text x="242" y="174.5">D3</text><text x="242" y="206">D4</text><text x="242" y="237.5">D5</text><text x="242" y="269">D6</text>
        <text x="398" y="80" text-anchor="end" font-weight="700" fill="#B3261E">5V</text>
        <text x="398" y="111.5" text-anchor="end" font-weight="700" fill="#2A2F35">GND</text>
        <text x="398" y="143" text-anchor="end" font-weight="700" fill="#CF3A2C">3V3</text>
        <text x="398" y="174.5" text-anchor="end">D10</text><text x="398" y="206" text-anchor="end">D9</text><text x="398" y="237.5" text-anchor="end">D8</text><text x="398" y="269" text-anchor="end">D7</text>
      </g>
      <text x="444" y="72" font-size="13" font-weight="700" fill="#B3261E">5V — never for the sensor</text>

      
      <!-- resistor legs: bare lead, sleeved in the real build -->
      <polyline points="300,531 90,531 90,56 226,56 226,68" fill="none" stroke="#8A939B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline points="360,531 630,531 630,107 414,107" fill="none" stroke="#8A939B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="84" y="300" font-size="12.5" text-anchor="end" fill="#56606A">resistor leg</text>
      <text x="495" y="549" font-size="12.5" text-anchor="middle" fill="#56606A">resistor leg</text>
      <text x="146" y="47" font-size="12" text-anchor="middle" fill="#56606A">leg + black in D0</text>

      <!-- resistor body, horizontal -->
      <rect x="300" y="520" width="60" height="22" rx="8" fill="#E6D2AA" stroke="#8C7A55" stroke-width="1"/>
      <rect x="309" y="520" width="6" height="22" fill="#7B4A2A"/>
      <rect x="321" y="520" width="6" height="22" fill="#1E1E1E"/>
      <rect x="333" y="520" width="6" height="22" fill="#E27A1F"/>
      <rect x="347" y="520" width="6" height="22" fill="#C7A53A"/>
      <text x="330" y="510" font-size="13" font-weight="700" text-anchor="middle" fill="currentColor">10 kΩ</text>
      <text x="330" y="566" font-size="12" text-anchor="middle" fill="#56606A">long legs — sleeve them</text>

      <!-- red: 3V3 -> C leg (cable wire 1) -->
      <polyline points="414,138.5 490,138.5 490,324 522,324" fill="none" stroke="#CF3A2C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="498" y="200" font-size="12.5" fill="#CF3A2C">red · cable to C</text>

      <!-- phototransistor, side view -->
      <path d="M515 292 V272 A15 15 0 0 1 545 272 V292 Z" fill="#E7EBEE" stroke="currentColor" stroke-width="1.6"/>
      <rect x="511" y="290" width="38" height="6" rx="1.5" fill="#E7EBEE" stroke="currentColor" stroke-width="1.4"/>
      <line x1="522" y1="296" x2="522" y2="324" stroke="currentColor" stroke-width="2"/>
      <line x1="538" y1="296" x2="538" y2="324" stroke="currentColor" stroke-width="2"/>
      <text x="556" y="290" font-size="13" font-weight="700" fill="currentColor">TEPT4400</text>
      <text x="514" y="318" font-size="13" font-weight="700" text-anchor="end" fill="currentColor" class="m">C</text>
      <text x="546" y="318" font-size="13" font-weight="700" fill="currentColor" class="m">E</text>
      <line x1="608" y1="218" x2="562" y2="256" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah3)"/>
      <line x1="616" y1="238" x2="566" y2="274" stroke="currentColor" stroke-width="1.6" marker-end="url(#ah3)"/>
      <text x="598" y="210" font-size="13" text-anchor="middle" fill="currentColor">light</text>

      
      <!-- black: D0 -> E leg (cable wire 2) -->
      <polyline points="226,75.5 112,75.5 112,460 538,460 538,324" fill="none" stroke="#2A2F35" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="320" y="452" font-size="12.5" text-anchor="middle" fill="#2A2F35">black · cable to E</text>
      <text x="548" y="432" font-size="12" fill="#56606A">2-wire cable</text>
    </svg>
